<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Emir Can Bacanak, software engineer</title>
  <desc id="d">Automation, AI-powered tooling and full-stack web. A diagram shows a manual task flowing through automation to a finished result.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1E3048"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DD6C6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3DD6C6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="18" fill="#0E1A2B"/>
  <rect width="1000" height="320" rx="18" fill="url(#grid)"/>
  <rect x="540" y="0" width="460" height="320" rx="18" fill="url(#glow)"/>

  <!-- identity -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="56" y="128" font-size="54" font-weight="700" fill="#E8EEF5" letter-spacing="-1">Emir Can Bacanak</text>
    <text x="56" y="172" font-size="24" fill="#9FB3C8">Software engineer</text>
    <text x="56" y="206" font-size="17" fill="#6E8399">Automation, AI-powered tooling, full-stack web</text>

    <circle cx="60" cy="270" r="5" fill="#3DD6C6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="275" font-size="15" fill="#C5D3E0">Open to full-time, part-time and freelance work</text>
  </g>

  <!-- pipeline: messy input -> automation -> clean output -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <g fill="#F5B544" opacity="0.55">
      <circle cx="588" cy="176" r="3"/>
      <circle cx="602" cy="226" r="2.5"/>
      <circle cx="574" cy="208" r="2"/>
      <circle cx="596" cy="192" r="2"/>
      <circle cx="580" cy="236" r="3"/>
    </g>

    <path id="flow" d="M620 200 H730" stroke="#2A405C" stroke-width="2" fill="none"/>
    <path d="M810 200 H908" stroke="#2A405C" stroke-width="2" fill="none"/>

    <circle cx="620" cy="200" r="9" fill="#0E1A2B" stroke="#F5B544" stroke-width="2"/>
    <rect x="730" y="166" width="80" height="68" rx="12" fill="#13253A" stroke="#3DD6C6" stroke-width="2"/>
    <text x="770" y="209" font-size="24" font-weight="700" fill="#3DD6C6" font-family="Consolas,'Courier New',monospace">{ }</text>
    <circle cx="918" cy="200" r="10" fill="#3DD6C6"/>
    <path d="M913 200 l4 4 l8 -8" stroke="#0E1A2B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="620" y="258" font-size="13" fill="#6E8399">Manual task</text>
    <text x="770" y="262" font-size="13" fill="#6E8399">Automation</text>
    <text x="918" y="258" font-size="13" fill="#6E8399">Done</text>

    <!-- the one moving element: work flowing through -->
    <circle r="4" fill="#F5B544">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M620 200 H730"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#3DD6C6">
      <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M810 200 H908"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
