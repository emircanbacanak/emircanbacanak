<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Emir Can Bacanak, software engineer</title>
  <desc id="d">Software engineer building automation, AI-powered tools and web applications. Open to full-time, part-time and freelance work.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DD6C6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3DD6C6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="18" fill="#0E1A2B" stroke="#1E3048" stroke-width="1.5"/>
  <rect x="560" y="1" width="439" height="298" rx="18" fill="url(#glow)"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="56" y="100" font-size="50" font-weight="700" fill="#E8EEF5" letter-spacing="-1">Emir Can Bacanak</text>
    <text x="56" y="140" font-size="22" font-weight="600" fill="#3DD6C6">Software Engineer</text>
    <text x="56" y="180" font-size="17" fill="#9FB3C8">I build automation, AI-powered tools and web applications</text>
    <text x="56" y="205" font-size="17" fill="#9FB3C8">that replace repetitive manual work.</text>

    <path d="M56 236 H944" stroke="#22344B" stroke-width="1.5"/>

    <circle cx="61" cy="266" r="5" fill="#3DD6C6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="271" font-size="15" fill="#C5D3E0">Open to full-time, part-time and freelance work</text>
    <text x="944" y="271" font-size="15" fill="#9FB3C8" text-anchor="end">canemircan973@gmail.com</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <path d="M652 100 H738" stroke="#2A405C" stroke-width="2" fill="none"/>
    <path d="M818 100 H906" stroke="#2A405C" stroke-width="2" fill="none"/>

    <circle cx="644" cy="100" r="8" fill="#0E1A2B" stroke="#F5B544" stroke-width="2"/>
    <rect x="740" y="70" width="76" height="60" rx="12" fill="#13253A" stroke="#3DD6C6" stroke-width="2"/>
    <text x="778" y="108" font-size="22" font-weight="700" fill="#3DD6C6" font-family="Consolas,'Courier New',monospace">{ }</text>
    <circle cx="918" cy="100" r="10" fill="#3DD6C6"/>
    <path d="M913 100 l4 4 l8 -8" stroke="#0E1A2B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="644" y="150" font-size="13" fill="#6E8399">Manual task</text>
    <text x="778" y="150" font-size="13" fill="#6E8399">Automation</text>
    <text x="918" y="150" font-size="13" fill="#6E8399">Done</text>

    <circle r="4" fill="#F5B544">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M652 100 H738"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#3DD6C6">
      <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M818 100 H906"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
