<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="t">
  <title id="t">What I build: automation, AI-powered tooling, full-stack web</title>
  <rect x="0.75" y="0.75" width="998.5" height="228.5" rx="18" fill="#0E1A2B" stroke="#1E3048" stroke-width="1.5"/>
  <path d="M350 40 V190 M674 40 V190" stroke="#22344B" stroke-width="1.5"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="56" y="48" width="28" height="4" rx="2" fill="#3DD6C6"/>
    <text x="56" y="90" font-size="22" font-weight="700" fill="#E8EEF5">Automation</text>
    <g font-size="15" fill="#9FB3C8">
      <text x="56" y="122">Scrapers, bots and workflow tools</text>
      <text x="56" y="146">that take repetitive work off</text>
      <text x="56" y="170">your plate.</text>
    </g>

    <rect x="380" y="48" width="28" height="4" rx="2" fill="#F5B544"/>
    <text x="380" y="90" font-size="22" font-weight="700" fill="#E8EEF5">AI-powered tooling</text>
    <g font-size="15" fill="#9FB3C8">
      <text x="380" y="122">Practical ML and LLM features</text>
      <text x="380" y="146">built into tools people already</text>
      <text x="380" y="170">use, not demos.</text>
    </g>

    <rect x="704" y="48" width="28" height="4" rx="2" fill="#6CA8FF"/>
    <text x="704" y="90" font-size="22" font-weight="700" fill="#E8EEF5">Full-stack web</text>
    <g font-size="15" fill="#9FB3C8">
      <text x="704" y="122">Database, API and responsive</text>
      <text x="704" y="146">frontend, built end to end and</text>
      <text x="704" y="170">ready to deploy.</text>
    </g>
  </g>
</svg>
